<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForgePanemulation</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- 1. 初期スタート画面 -->
    <div id="start-screen">
        <h1>CONTROL PANEL BUILDER</h1>
        <button class="btn" id="create-btn">⚡ 新規制御盤を設計する</button>
    </div>

    <!-- 2. 銘板・初期設定メニュー -->
    <div id="menu-modal">
        <h2>ForgePanemulation - 制御盤設計仕様</h2>
        <div class="form-group">
            <label>盤の名称 (銘板に刻印)</label>
            <input type="text" id="panel-name" value="MAIN CONTROL PANEL">
        </div>
        <div class="form-group">
            <label>主回路電圧</label>
            <select id="panel-voltage">
                <option value="AC 200V">AC 200V (三相)</option>
                <option value="AC 100V" selected>AC 100V (単相)</option>
                <option value="DC 24V">DC 24V</option>
            </select>
        </div>
        <button class="btn" id="build-btn" style="width:100%;">この設定で盤を製造する 🛠️</button>
    </div>

    <!-- 3. メインの制御盤パネル画面 -->
    <!-- index.html の変更イメージ（右側にメニューを追加） -->
<div id="workspace" style="display: flex; gap: 20px;">
    <div id="canvas-container">
        <canvas id="panelCanvas" width="800" height="550"></canvas>
    </div>
    
    <!-- ★右側の機器設定メニュー -->
    <div id="right-menu" style="display: none; width: 200px; background: #2c3e50; padding: 20px; border-radius: 8px;">
        <h3>機器設定</h3>
        <div id="terminal-config">
            <label>端子台の極数 (P):</label>
            <select id="terminal-poles">
                <option value="3">3P (電源用など)</option>
                <option value="4" selected>4P (標準)</option>
                <option value="6">6P (多め)</option>
                <option value="10">10P (一括用)</option>
            </select>
            <button class="btn" id="confirm-add-terminal" style="margin-top: 15px; width: 100%;">端子台を配置 🛠️</button>
        </div>
    </div>
</div>


        <!-- モジュールとしてapp.jsを読み込む -->
    <script type="module" src="scripts/app.js"></script>
</body>
</html>
