<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForgePanemulation</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- 1. 初期スタート画面 -->
    <div id="start-screen">
        <h1>CONTROL PANEL BUILDER</h1>
        <button class="btn" id="create-btn">⚡ 新規制御盤を設計する</button>
    </div>

    <!-- 2. 銘板・初期設定メニュー -->
    <div id="menu-modal">
        <h2>ForgePanemulation - 制御盤設計仕様</h2>
        <div class="form-group">
            <label>盤の名称 (銘板に刻印)</label>
            <input type="text" id="panel-name" value="MAIN CONTROL PANEL">
        </div>
        <div class="form-group">
            <label>主回路電圧</label>
            <select id="panel-voltage">
                <option value="AC 200V">AC 200V (三相)</option>
                <option value="AC 100V" selected>AC 100V (単相)</option>
                <option value="DC 24V">DC 24V</option>
            </select>
        </div>
        <button class="btn" id="build-btn" style="width:100%;">この設定で盤を製造する 🛠️</button>
    </div>

    <!-- 3. メインの制御盤パネル画面 (Canvasと右メニューの横並び) -->
    <div id="workspace">
        <div id="workspace-container">
            <div id="canvas-container">
                <canvas id="panelCanvas" width="800" height="550"></canvas>
            </div>
            
            <!-- ★ここが新設された JavaScriptから中身を可変させる右メニュー -->
            <div id="right-menu">
                <h3>機器詳細設定</h3>
                <div id="menu-content">
                    <p style="color: #bdc3c7; font-size: 0.9rem;">パーツを選択すると、ここに詳細な設定メニューが動的に生成されます。</p>
                </div>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn" id="view-btn">🔓 中を開ける</button>
            
            <!-- トビラ（外観）の時に出すボタン -->
            <button class="btn" id="add-ext-switch-btn">+ トビラ用スイッチを追加</button>
            
            <!-- 盤内（内部）の時に出すボタン -->
            <button class="btn" id="add-relay-btn" style="display:none;">+ リレーを追加</button>
            <button class="btn" id="add-terminal-btn" style="display:none;">+ 可変端子台を追加</button>
        </div>
    </div>

    <script type="module" src="scripts/app.js"></script>
</body>
</html>
